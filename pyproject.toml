[project]
name = "singhacks26"
version = "0.1.0"
description = "Hackathon project for the SingHacks 2026 challenge."
readme = "README.md"
requires-python = ">=3.11.15"
dependencies = [
    "pandas>=2.0",
    "streamlit>=1.63.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "pip>=26.2.1",
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/singhacks26"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
